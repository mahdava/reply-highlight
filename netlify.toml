# The theme designer is one static page in the designer folder. The build only
# checks it: when the check fails, Netlify keeps the last good page online.
[build]
  publish = "designer"
  command = "node scripts/check-designer.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The llms files hold flower symbols: say they are UTF-8.
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
